---
# tasks/feeds.yml - feeds.conf, update e install

# Residui del vecchio feed locale 'uspot' (src-link a custom-feeds/), sostituito
# dagli override in files/feed-overrides/: nelle build dir persistenti i link
# rimasti farebbero esistere uspot in due feed.
- name: Rimuovi i residui del vecchio feed locale uspot
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ openwrt_src_dir }}/package/feeds/uspot"
    - "{{ openwrt_src_dir }}/feeds/uspot"
    - "{{ openwrt_src_dir }}/feeds/uspot.index"
    - "{{ openwrt_src_dir }}/feeds/uspot.targetindex"
    - "{{ openwrt_build_basedir }}/custom-feeds"

# Gli override scrivono dentro i checkout git dei feed: vanno annullati prima
# dell'update, altrimenti 'git pull' trova l'albero sporco.
- name: Annulla gli override dei feed della build precedente
  ansible.builtin.shell: |
    for d in feeds/*/; do
      [ -d "$d/.git" ] && git -C "$d" checkout -- . 2>/dev/null
    done
    exit 0
  args:
    chdir: "{{ openwrt_src_dir }}"
  changed_when: false

- name: Scrivi feeds.conf
  ansible.builtin.shell: |
    set -e
    {
      {% for feed in openwrt_feeds %}
      echo "{{ feed }}"
      {% endfor %}
      sed '/telephony/d' feeds.conf.default
    } > feeds.conf
  args:
    chdir: "{{ openwrt_src_dir }}"
    executable: /bin/bash
  changed_when: true

- name: Update feeds
  ansible.builtin.command:
    cmd: ./scripts/feeds update -a -f
    chdir: "{{ openwrt_src_dir }}"
  changed_when: true

# Sovrascrive file dei feed con le versioni in files/feed-overrides/<feed>/...
# (stessa struttura di feeds/). Oggi: net/uspot del feed 'packages', pinnato al
# commit upstream 87080bfa che corregge il typo di sintassi in uspot.uc (il pin
# del feed 'packages' di v25.12.5 porta 913980c0, daemon in crash-loop).
# Si modifica il pacchetto al suo posto invece di affiancargli un feed con lo
# stesso nome: con il feed duplicato le build #18/#19 hanno comunque prodotto
# immagini con 913980c0 (vedi controllo in ib_seed.yml).
- name: Applica gli override ai feed
  ansible.builtin.copy:
    src: "feed-overrides/"
    dest: "{{ openwrt_src_dir }}/feeds/"
    mode: preserve
  changed_when: true

- name: Install feeds
  ansible.builtin.command:
    cmd: ./scripts/feeds install -a -f
    chdir: "{{ openwrt_src_dir }}"
  changed_when: true

- name: Rimuovi pacchetti broken
  ansible.builtin.file:
    path: "{{ openwrt_src_dir }}/{{ item }}"
    state: absent
  loop: "{{ openwrt_remove_packages }}"
