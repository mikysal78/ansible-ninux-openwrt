---
# tasks/clone_openwrt.yml - Clone / update upstream OpenWrt source

- name: Verifica se OpenWrt source esiste già (.git)
  ansible.builtin.stat:
    path: "{{ openwrt_src_dir }}/.git"
  register: _openwrt_git_dir

- name: Verifica se la directory esiste ma e' vuota/corrotta (senza .git)
  ansible.builtin.stat:
    path: "{{ openwrt_src_dir }}"
  register: _openwrt_dir

- name: Rimuovi directory openwrt corrotta (esiste ma senza .git)
  ansible.builtin.file:
    path: "{{ openwrt_src_dir }}"
    state: absent
  when:
    - _openwrt_dir.stat.exists
    - not _openwrt_git_dir.stat.exists

- name: Clone OpenWrt upstream (prima volta)
  ansible.builtin.git:
    repo: "{{ openwrt_upstream_repo }}"
    dest: "{{ openwrt_src_dir }}"
    version: "{{ openwrt_version }}"
    force: false
  when: not _openwrt_git_dir.stat.exists

- name: Fetch tutti i ref nel repo esistente
  ansible.builtin.command:
    cmd: git fetch --all --tags
    chdir: "{{ openwrt_src_dir }}"
  when: _openwrt_git_dir.stat.exists
  changed_when: false

- name: Checkout versione OpenWrt
  ansible.builtin.command:
    cmd: "git checkout -f {{ openwrt_version }}"
    chdir: "{{ openwrt_src_dir }}"
  changed_when: true

# netconsole dinamico (configfs): OpenWrt compila kmod-netconsole con
# CONFIG_NETCONSOLE_DYNAMIC=n. Con =y il target creato dai parametri del modulo
# compare in /sys/kernel/config/netconsole/cmdline0 e il template OpenWISP
# «Netconsole» gli aggiunge l'userdata ninux_node (nome del device): il server
# salva i log per nome invece che per IP. Il Kconfig vuole CONFIGFS_FS, da qui
# la dipendenza da kmod-fs-configfs. Il checkout -f sopra riporta il file
# all'originale a ogni build, quindi la modifica si riapplica sempre.
- name: "Netconsole: abilita NETCONSOLE_DYNAMIC in kmod-netconsole"
  ansible.builtin.replace:
    path: "{{ openwrt_src_dir }}/package/kernel/linux/modules/netsupport.mk"
    regexp: '(TITLE:=Network console logging support\n)(  KCONFIG:=CONFIG_NETCONSOLE \\\n\s*)CONFIG_NETCONSOLE_DYNAMIC=n'
    replace: '\1  DEPENDS:=+kmod-fs-configfs\n\2CONFIG_NETCONSOLE_DYNAMIC=y'

- name: "Netconsole: verifica che la modifica sia applicata"
  ansible.builtin.command:
    cmd: grep -q 'CONFIG_NETCONSOLE_DYNAMIC=y' package/kernel/linux/modules/netsupport.mk
    chdir: "{{ openwrt_src_dir }}"
  changed_when: false

# Patch del kernel per target (files/kernel-patches/<target>/): finiscono in
# target/linux/<target>/patches-6.12 e il kernel le applica dopo quelle di
# OpenWrt. Il checkout -f sopra non tocca i file non tracciati, ma la copia si
# ripete a ogni build. WRT3200ACM: i LED wlan_2g/wlan_5g del device tree sono
# in realta' i reset PCIe delle schede wifi (accendere il LED = radio morta).
- name: Cerca le patch del kernel per target
  ansible.builtin.find:
    paths: "{{ role_path }}/files/kernel-patches"
    patterns: "*.patch"
    recurse: true
  register: _kernel_patches

# with_fileglob non espande le directory (kernel-patches/*/): la build #39 ha
# saltato la patch senza errori, quindi ora una lista vuota ferma la build
- name: Verifica che ci siano patch del kernel
  ansible.builtin.assert:
    that: _kernel_patches.matched > 0
    fail_msg: "Nessuna patch in {{ role_path }}/files/kernel-patches"

- name: Patch del kernel per target
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ openwrt_src_dir }}/target/linux/{{ item.path | dirname | basename }}/patches-6.12/"
    mode: "0644"
  loop: "{{ _kernel_patches.files }}"
  loop_control:
    label: "{{ item.path | dirname | basename }}/{{ item.path | basename }}"
