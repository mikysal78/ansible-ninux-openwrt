[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
interpreter_python = auto_silent
# I moduli non scrivono i propri argomenti nel journal dell'host: lo facevano
# anche con le intestazioni Authorization (token API di OpenWISP in chiaro).
no_target_syslog   = True

[ssh_connection]
pipelining         = true
